  * { box-sizing: border-box; margin: 0; padding: 0; }

    color: #e0f0e8;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #header {
    background: linear-gradient(135deg, #0d2818, #0a1a14);
    border-bottom: 1px solid #1e4a30;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 10;
  }
  #header h1 {
    font-size: 1.1rem;
    color: #5ddb9f;
    font-weight: 700;
  }
  #legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    color: #b0d8c8;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }
  #graph-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  svg { width: 100%; height: 100%; cursor: grab; }
  svg:active { cursor: grabbing; }
  .link {
    stroke-opacity: 0.5;
    stroke-width: 1.2;
  }
  .node { cursor: pointer; }
  .node:hover circle { stroke: #fff; stroke-width: 3px; }
  .node-label {
    font-size: 9px;
    fill: #c0e8d8;
    pointer-events: none;
    text-anchor: middle;
    paint-order: stroke;
    stroke: #0a1a14;
    stroke-width: 2.5px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #tooltip {
    position: absolute;
    background: rgba(13, 40, 24, 0.95);
    border: 1px solid #2e7a50;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: #e0f0e8;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 360px;
    line-height: 1.5;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  #tooltip h4 { color: #5ddb9f; margin-bottom: 4px; font-size: 0.85rem; }
  #tooltip .rel { color: #a0c8b8; font-size: 0.7rem; }
  #tooltip .rel b { color: #ffb74d; }
  #controls {
    position: absolute;
    bottom: 16px; left: 16px;
    display: flex; gap: 6px;
    z-index: 10;
  }
  .btn {
    background: rgba(13,40,24,0.9);
    border: 1px solid #2e7a50;
    color: #5ddb9f;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.75rem;
    transition: all 0.2s;
  }
  .btn:hover { background: #1e4a30; color: #fff; }
  #stats {
    position: absolute;
    top: 12px; right: 16px;
    background: rgba(13,40,24,0.85);
    border: 1px solid #2e7a50;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.72rem;
    color: #a0c8b8;
    z-index: 10;
    backdrop-filter: blur(8px);
  }
  #stats span { color: #5ddb9f; font-weight: 700; }

// Build node map

// ── build legend ─────────────────────────────────────────────────────────────
const legendEl = document.getElementById('legend');
Object.entries(TYPE_LABEL).forEach(([k, v]) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<div class="legend-dot" style="background:${COLOR[k]}"></div>${v}`;
  legendEl.appendChild(item);
});

// ── D3 force graph ───────────────────────────────────────────────────────────
const svg = d3.select('svg');
const container = svg.append('g');

const zoom = d3.zoom().scaleExtent([0.2, 4]).on('zoom', (e) => {
  container.attr('transform', e.transform);
});
svg.call(zoom);

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges).id(d => d.id).distance(90).strength(0.4))
  .force('charge', d3.forceManyBody().strength(-280))
  .force('center', d3.forceCenter(W / 2, H / 2))
  .force('collision', d3.forceCollide().radius(28));

const link = container.append('g').selectAll('line')
  .data(edges).join('line')
  .attr('class', 'link')
  .attr('stroke', '#2e7a50')
  .attr('stroke-dasharray', d => d.l.includes('wp_enqueue') ? '4,3' : 'none');

const linkLabel = container.append('g').selectAll('text')
  .data(edges).join('text')
  .attr('font-size', '7px')
  .attr('fill', '#5a9a78')
  .attr('text-anchor', 'middle')
  .attr('dy', -3)
  .text(d => d.l)
  .style('pointer-events', 'none');

const node = container.append('g').selectAll('g')
  .data(nodes).join('g').attr('class', 'node')
  .call(d3.drag()
    .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end',   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append('circle')
  .attr('r', d => d.type === 'functions' || d.type === 'theme-class' ? 10 : 7)
  .attr('fill', d => COLOR[d.type] || '#888')
  .attr('stroke', '#0a1a14')
  .attr('stroke-width', 1.5);

node.append('text')
  .attr('class', 'node-label')
  .attr('dy', d => (d.type === 'functions' || d.type === 'theme-class' ? 14 : 11))
  .text(d => d.label);

simulation.on('tick', () => {
  link
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);
  linkLabel
    .attr('x', d => (d.source.x + d.target.x) / 2)
    .attr('y', d => (d.source.y + d.target.y) / 2);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
});

// ── tooltip ──────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');

function incoming(nodeId) {
  return edges.filter(e => e.t.id === nodeId || e.t === nodeId)
    .map(e => ({ from: (e.s.id || e.s), rel: e.l }));
}
function outgoing(nodeId) {
  return edges.filter(e => e.s.id === nodeId || e.s === nodeId)
    .map(e => ({ to: (e.t.id || e.t), rel: e.l }));
}

node.on('mouseenter', (e, d) => {
  const inc = incoming(d.id);
  const out = outgoing(d.id);
  let html = `<h4>${d.label}</h4>`;
  html += `<div class="rel"><b>نوع:</b> ${TYPE_LABEL[d.type] || d.type}</div>`;
  html += `<div class="rel" style="margin-top:4px"><b>وارد می‌شود از (${inc.length}):</b><br>` +
    inc.slice(0,5).map(r => `  ← ${r.from} <small>[${r.rel}]</small>`).join('<br>') +
    (inc.length > 5 ? `<br>  +${inc.length-5} مورد دیگر` : '') + `</div>`;
  html += `<div class="rel" style="margin-top:4px"><b>وارد می‌کند به (${out.length}):</b><br>` +
    out.slice(0,5).map(r => `  → ${r.to} <small>[${r.rel}]</small>`).join('<br>') +
    (out.length > 5 ? `<br>  +${out.length-5} مورد دیگر` : '') + `</div>`;
  html += `<div class="rel" style="margin-top:4px"><b>کل ارتباطات:</b> ${inc.length + out.length}</div>`;
  tooltip.innerHTML = html;
  tooltip.style.opacity = '1';
  const rect = document.getElementById('graph-container').getBoundingClientRect();
  tooltip.style.left = Math.min(e.clientX - rect.left + 14, rect.width - 370) + 'px';
  tooltip.style.top  = Math.min(e.clientY - rect.top  + 14, rect.height - 200) + 'px';
})
.on('mouseleave', () => { tooltip.style.opacity = '0'; });

// ── controls ─────────────────────────────────────────────────────────────────
function resetZoom() {
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity);
}
let showLabels = true;
function toggleLabels() {
  showLabels = !showLabels;
  node.selectAll('text').style('display', showLabels ? null : 'none');
}

  🏷️ <span>${Object.keys(COLOR).length}</span> دسته‌بندی<br>
  <small style="color:#7a9a8a">برای جستجو در نمودار روی گره‌ها کلیک یا هاور کنید</small>
`;

// Center initially
svg.call(zoom.transform, d3.zoomIdentity.translate(W/2, H/2).scale(0.7).translate(-W/2, -H/2));
